name: Build Electron Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Verify JavaScript and migration tests
        shell: pwsh
        run: |
          npm run check
          Get-ChildItem electron -Filter *.js -Recurse | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid JS: $($_.FullName)" }
          }
          Get-ChildItem src/HernandesCheckout/Resources -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid JS: $($_.FullName)" }
          }

      - name: Build portable Windows EXE
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/HernandesCheckout.exe")) {
            throw "HernandesCheckout.exe not generated"
          }
          Get-Item "dist/HernandesCheckout.exe" | Format-List Name,Length

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: HernandesCheckout-Electron-Windows
          path: dist/HernandesCheckout.exe
          if-no-files-found: error
