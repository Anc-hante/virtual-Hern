name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore "src/HernandesCheckout/HernandesCheckout.csproj"

      - name: Build
        shell: pwsh
        run: |
          dotnet build "src/HernandesCheckout/HernandesCheckout.csproj" -c Release --no-restore

      - name: Publish single EXE
        shell: pwsh
        run: |
          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

          dotnet publish "src/HernandesCheckout/HernandesCheckout.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o dist `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/HernandesCheckout.exe")) {
            throw "HernandesCheckout.exe was not generated"
          }

          $files = Get-ChildItem "dist" -File
          $files | Format-Table Name,Length

          if ($files.Count -ne 1) {
            Write-Warning "Publish produced more than one file. The EXE remains the supported launcher."
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: HernandesCheckout-WebView2-Windows
          path: dist/HernandesCheckout.exe
          if-no-files-found: error
